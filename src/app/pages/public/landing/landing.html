<div class="landing-page ocean-bg">
    <!-- Full-screen Background Image -->
    <div class="fullscreen-bg">
        <video autoplay muted loop playsinline poster="/assets/grpfishunderwater.webp">
            <!-- Expected video file -> -->
            <source src="/assets/grpfishunderwater.mp4" type="video/mp4">
            <!-- Fallback to image if video not supported/found -->
            <img src="/assets/grpfishunderwater.webp" alt="Underwater coral reef background" />
        </video>
    </div>

    <!-- Cyan Gradient Overlay -->
    <div class="gradient-overlay gradient-overlay-cyan"></div>

    <!-- Content wrapper -->
    <div class="content-wrapper text-overlay landing-content">
        <div class="container-fluid px-6 pt-32">
            <!-- Hero Content -->
            <div class="hero-content">
                <div class="max-w-4xl" *ngIf="settings$ | async as settings">
                    <h1 class="hero-title text-8xl text-9xl-md mb-4">
                        {{ settings.siteName }}
                    </h1>
                    <p class="hero-subtitle text-xl mb-16 tracking-wide">
                        {{ settings.description }}
                    </p>
                </div>
            </div>
        </div>

        <!-- Action Buttons - Bottom Row (Fixed at bottom) -->
        <div class="action-buttons-row">
            <div class="container-fluid px-6 pb-8">
                <div class="d-flex flex-wrap gap-4 align-items-center justify-content-between">
                    <div class="d-flex flex-wrap gap-4">
                        <a routerLink="/corals" class="glass-button d-inline-flex align-items-center gap-2">
                            <i class="bi bi-heart"></i>
                            ADOPT A CORAL
                        </a>
                        <a routerLink="/articles" class="glass-button d-inline-flex align-items-center gap-2">
                            <i class="bi bi-file-text"></i>
                            ARTICLE
                        </a>
                    </div>
                    <div class="d-flex align-items-center gap-4">
                        <!-- Social Media Icons -->
                        <div class="d-flex align-items-center gap-3">
                            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"
                                class="glass-icon-circle" aria-label="Instagram">
                                <i class="bi bi-instagram"></i>
                            </a>
                            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer"
                                class="glass-icon-circle" aria-label="YouTube">
                                <i class="bi bi-youtube"></i>
                            </a>
                            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer"
                                class="glass-icon-circle" aria-label="Facebook">
                                <i class="bi bi-facebook"></i>
                            </a>
                            <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="glass-icon-circle"
                                aria-label="Twitter">
                                <i class="bi bi-twitter-x"></i>
                            </a>
                        </div>

                        <!-- Donate Button -->
                        <a routerLink="/donate" class="glass-button px-10">
                            DONATE US
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
